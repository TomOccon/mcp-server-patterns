[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-patterns"
version = "0.1.0"
description = "Reference implementation of production patterns for a Python MCP server over a data platform (fake backend)."
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcp-patterns = "mcp_patterns.server:main"

[tool.setuptools]
packages = ["mcp_patterns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
